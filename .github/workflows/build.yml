name: Build

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs: 
  
  build-shared:
    
    runs-on: ubuntu-latest
    
    env:
      CORE: ${{ github.workspace }}/OUT-Core
      
    steps:
      
      - uses: actions/checkout@v7.0.1

      - run: dotnet pack -o ${{ env.CORE }}
        working-directory: BaSL

      - run: dotnet pack -o ${{ env.CORE }}
        working-directory: Generators/BaSL.SourceGenerators

      - uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ env.CORE }}/BaSL*.nupkg
          name: 'NuGet Packages'
          if-no-files-found: error
  
  build-native:
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: lose
    
    runs-on: ${{ matrix.os }}
    
    env:
      TERMINAL: ${{ github.workspace }}/OUT-Terminal
      ZIP: BaSL.Terminal-${{ matrix.name }}-x64.zip

    steps:

      - uses: actions/checkout@v7.0.1

      - run: dotnet publish -o ${{ env.TERMINAL }}
        working-directory: BaSL.Terminal
        
      - run: dotnet run ${{ github.workspace }}/bundle.cs -- ${{ env.ZIP }}
        working-directory: ${{ env.TERMINAL }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ env.TERMINAL }}/${{ env.ZIP }}
          name: ${{ matrix.name }}
          if-no-files-found: error
  
  release:
    
    runs-on: ubuntu-latest
    needs: [build-shared, build-native]
    if: github.event_name == 'release'
    
    steps:

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*'

      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: '*'